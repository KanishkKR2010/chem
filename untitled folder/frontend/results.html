<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Final Results</title>

<link rel="stylesheet" href="css/lobby.css">

</head>

<body>

<div class="container">

<h1>
Chem<span>Bonding</span>
</h1>

<h2>Final Leaderboard</h2>

<div id="results"></div>

</div>

<script>

const data =
    JSON.parse(
        sessionStorage.getItem(
            "finalLeaderboard"
        ) || "[]"
    );

const container =
    document.getElementById(
        "results"
    );

data.forEach(
    (player, index) => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "player";

        div.style.margin =
            "10px";

        div.innerHTML =
            `<strong>
                #${index + 1}
            </strong>
            &nbsp;
            ${player.name}
            <strong>
                ${player.score}
            </strong>`;

        container.appendChild(
            div
        );

    }
);

</script>

</body>

</html>
